[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tayba_theme"
authors = [
    { name = "Tayba Theme", email = "info@example.com"}
]
description = "High-Visibility Modern Slate Theme for ERPNext"
